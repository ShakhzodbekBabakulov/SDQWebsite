name: Check and upload videos

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Test the website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the source commit
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Build the website
        run: npm run build

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Validate exported pages and sitemap
        run: python3 scripts/verify-export.py

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed local video storage
        run: npm run upload:videos -- --local

      - name: Test with the Cloudflare runtime
        run: npm run test:e2e -- --project=chromium
        env:
          SDQ_USE_CLOUDFLARE: "1"
          SDQ_PREVIEW_URL: http://127.0.0.1:3106

      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failures-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  videos:
    name: Upload videos to production storage
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: sdq-video-upload
      cancel-in-progress: false
    steps:
      - name: Check out the tested source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate the video manifest from the sources
        run: node scripts/prepare-video.mjs

      # Cloudflare Pages builds and publishes the pages itself from main.
      # This job only makes sure every referenced movie exists in the bucket.
      - name: Upload videos
        run: npm run upload:videos -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
